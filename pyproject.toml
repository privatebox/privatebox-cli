[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privatebox-cli"
version = "0.1.0"
description = "Agent-friendly CLI for the PrivateBox API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PrivateBox"}]
dependencies = [
  "typer>=0.12.0",
  "requests>=2.31.0",
  "keyring>=25.0.0",
  "pydantic>=2.0.0",
]

[project.scripts]
privatebox = "privatebox.cli:app"

[tool.setuptools.packages.find]
include = ["privatebox*"]
